name: Import upstream repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'zxncvb/AISolidworks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified upstream snapshot
        shell: bash
        env:
          SOURCE_REPOSITORY: wzyn20051216/solidworks-automation-skill
          SOURCE_COMMIT: 9ba848e301e996cc64d8078df13f4ccc24416339
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/upstream"
          git clone --filter=blob:none --no-checkout "https://github.com/$SOURCE_REPOSITORY.git" "$upstream"
          git -C "$upstream" checkout --detach "$SOURCE_COMMIT"
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$upstream/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import SolidWorks automation skill

          Source: https://github.com/$SOURCE_REPOSITORY
          Source commit: $SOURCE_COMMIT"
          git push origin HEAD:main
